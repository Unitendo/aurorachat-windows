name: Build AuroraChat Windows

on:
  push:
    branches: [ "**" ]
    paths:
      - 'Cargo.toml'
      - 'source/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'Cargo.toml'
      - 'source/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust with GNU toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
          default: true

      - run: cargo build --target x86_64-pc-windows-gnu

      - name: Upload windows build
        uses: actions/upload-artifact@v7
        with:
          name: AuroraChat Windows Automatic Build (could be unfinished!)
          path: ./target/x86_64-pc-windows-gnu/debug/aurorachat-windows.exe